<header class="site-header" data-header>
  <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }}, home">
    {{ partial "branding.html" . }}
  </a>
  <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Open navigation">
    <span></span><span></span>
  </button>
  <nav id="primary-nav" class="primary-nav" aria-label="Primary navigation">
    {{ range site.Menus.main }}
    {{ if eq .Name "About" }}
    <div class="nav-dropdown" data-nav-dropdown>
      <a class="nav-dropdown-toggle" href="{{ "journal/#blog-reviews" | relURL }}" aria-expanded="false" aria-controls="blog-menu" data-nav-dropdown-toggle>Blog</a>
      <div id="blog-menu" class="nav-dropdown-menu" data-nav-dropdown-menu>
        <a href="{{ "journal/#blog-reviews" | relURL }}">Blog Reviews</a>
        <a href="{{ "journal/#community" | relURL }}">Community</a>
        <a href="{{ "journal/#interviews" | relURL }}">Interviews</a>
      </div>
    </div>
    {{ end }}
    <a href="{{ .URL }}">{{ .Name }}</a>
    {{ end }}
  </nav>
  <div class="auth-controls" data-auth-controls>
    <button class="auth-link" type="button" data-auth-open>Log in</button>
    <button class="auth-link auth-user" type="button" data-auth-user hidden></button>
    <button class="auth-link" type="button" data-auth-logout hidden>Log out</button>
  </div>
</header>
<dialog class="auth-dialog" data-auth-dialog aria-label="Kinora account">
  <form class="auth-panel" method="dialog" data-auth-form>
    <button class="auth-close" type="button" data-auth-close aria-label="Close account dialog">×</button>
    <span class="card-label">Kinora account</span>
    <h2>Personalize Kinora</h2>
    <p>Log in to save movies, rate films, write reviews, and set release reminders.</p>
    <label>Email<input type="email" name="email" autocomplete="email" required></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required minlength="6"></label>
    <label>Username<input type="text" name="username" autocomplete="username" placeholder="Only needed for sign up"></label>
    <label>Display name<input type="text" name="displayName" autocomplete="name" placeholder="Optional"></label>
    <div class="auth-actions">
      <button class="button" type="submit" data-auth-action="login"><span>Log in</span><span aria-hidden="true">›</span></button>
      <button class="button" type="submit" data-auth-action="signup"><span>Sign up</span><span aria-hidden="true">＋</span></button>
    </div>
    <p class="form-message" data-auth-message aria-live="polite"></p>
  </form>
</dialog>
