<header class="site-header" data-header>
  <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }}, home">
    {{ partial "branding.html" . }}
  </a>
  <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Open navigation">
    <span></span><span></span>
  </button>
  <nav id="primary-nav" class="primary-nav" aria-label="Primary navigation">
    {{ range site.Menus.main }}
    {{ if eq .Name "About" }}
    <div class="nav-dropdown" data-nav-dropdown>
      <a class="nav-dropdown-toggle" href="{{ "journal/#blog-reviews" | relURL }}" aria-expanded="false" aria-controls="blog-menu" data-nav-dropdown-toggle>Blog</a>
      <div id="blog-menu" class="nav-dropdown-menu" data-nav-dropdown-menu>
        <a href="{{ "journal/#blog-reviews" | relURL }}">Blog Reviews</a>
        <a href="{{ "journal/#community" | relURL }}">Community</a>
        <a href="{{ "journal/#interviews" | relURL }}">Interviews</a>
      </div>
    </div>
    {{ end }}
    <a href="{{ .URL | relURL }}">{{ .Name }}</a>
    {{ end }}
  </nav>
  <div class="auth-controls" data-auth-controls>
    <button class="auth-link" type="button" data-auth-open>Log in</button>
    <div class="account-menu" data-account-menu hidden>
      <button class="auth-link auth-user" type="button" data-auth-user aria-expanded="false" aria-controls="account-menu-panel"><span data-auth-initial></span><strong data-auth-name></strong></button>
      <div id="account-menu-panel" class="account-menu-panel" data-account-menu-panel>
        <a href="{{ site.Home.RelPermalink }}#my-library" data-account-link="my-library">My Library</a>
        <button type="button" data-auth-profile>Profile</button>
        <button type="button" data-auth-logout>Log out</button>
      </div>
    </div>
  </div>
</header>
<dialog class="auth-dialog" data-auth-dialog aria-label="Kinora account">
  <form class="auth-panel" method="dialog" data-auth-form data-auth-mode="login">
    <button class="auth-close" type="button" data-auth-close aria-label="Close account dialog">×</button>
    <span class="card-label">Kinora account</span>
    <h2 data-auth-title>Log in</h2>
    <p data-auth-copy>Access your saved movies, ratings, reviews, and release reminders.</p>
    <div class="auth-tabs" aria-label="Account mode">
      <button type="button" class="auth-tab is-active" data-auth-mode-button="login">Log in</button>
      <button type="button" class="auth-tab" data-auth-mode-button="signup">Sign up</button>
    </div>
    <label>Email<input type="email" name="email" autocomplete="email" required></label>
    <label data-auth-password-field>Password<input type="password" name="password" autocomplete="current-password" required minlength="6"></label>
    <div class="auth-signup-fields" data-auth-signup-fields hidden>
      <label>Username<input type="text" name="username" autocomplete="username" placeholder="Choose a username"></label>
      <label>Display name<input type="text" name="displayName" autocomplete="name" placeholder="Optional"></label>
    </div>
    <div class="auth-actions">
      <button class="button" type="submit" data-auth-submit><span data-auth-submit-label>Log in</span><span aria-hidden="true" data-auth-submit-icon>›</span></button>
    </div>
    <button class="auth-forgot" type="button" data-auth-forgot>Forgot password?</button>
    <button class="auth-switch" type="button" data-auth-switch>New to Kinora? Create account</button>
    <p class="form-message" data-auth-message aria-live="polite"></p>
  </form>
</dialog>
